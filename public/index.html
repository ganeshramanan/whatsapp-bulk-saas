<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grambi | WhatsApp Broadcast SaaS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Prevent iOS text zoom and improve touch targets */
    input, select, textarea, button {
      font-size: 16px !important;
    }
    @media (min-width: 640px) {
      input, select, textarea, button {
        font-size: 14px !important;
      }
    }
    /* Smooth mobile scrolling */
    body {
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

  <!-- ================= AUTH VIEW (Login / Register) ================= -->
  <div id="authView" class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-xl border border-slate-100">
      
      <!-- Brand Header -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-md shadow-emerald-600/20">
          G
        </div>
        <h1 class="text-xl font-bold text-slate-900 mt-3">Welcome to Grambi</h1>
        <p class="text-xs text-slate-500 mt-1">Smart WhatsApp Bulk Broadcasting</p>
      </div>

      <!-- Tabs: Sign In / Register -->
      <div class="flex border-b border-slate-200 mb-6 text-sm font-medium">
        <button id="tabLogin" class="flex-1 pb-3 text-emerald-600 border-b-2 border-emerald-600 text-center font-semibold transition">
          Sign In
        </button>
        <button id="tabRegister" class="flex-1 pb-3 text-slate-400 hover:text-slate-600 text-center transition">
          Register Customer
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Business Email</label>
          <input id="loginEmail" type="email" required placeholder="name@company.com"
                 class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
          <input id="loginPassword" type="password" required placeholder="••••••••"
                 class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/25 transition flex items-center justify-center space-x-2">
          <span>Sign In to Dashboard</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Register Form (Collects Meta IDs One Time) -->
      <form id="registerForm" class="space-y-3.5 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Business Name</label>
          <input id="regBusinessName" type="text" required placeholder="e.g. Apex Hospital / City Clinic"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
            <input id="regEmail" type="email" required placeholder="admin@store.com"
                   class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
            <input id="regPassword" type="password" required placeholder="••••••••"
                   class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
          </div>
        </div>

        <div class="pt-3 border-t border-slate-100 space-y-2.5">
          <p class="text-[11px] font-bold text-slate-800 uppercase tracking-wider">WhatsApp Meta Setup (One-Time)</p>
          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-1">Phone Number ID</label>
            <input id="regPhoneId" type="text" required placeholder="1269930609537457 or Test ID"
                   class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-1">Permanent Access Token</label>
            <input id="regToken" type="password" required placeholder="EAAG..."
                   class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/25 transition mt-2">
          Create Account & Connect
        </button>
      </form>

      <div id="authAlert" class="hidden mt-4 p-3.5 rounded-2xl text-xs font-medium"></div>
    </div>
  </div>

  <!-- ================= DASHBOARD VIEW (100% Mobile & Touch Friendly) ================= -->
  <div id="dashboardView" class="hidden flex-1 flex flex-col">
    
    <!-- Top Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-sm sm:text-base shadow-sm">
            G
          </div>
          <div class="truncate max-w-[150px] sm:max-w-xs">
            <h1 class="text-xs sm:text-sm font-bold text-slate-900 leading-tight truncate" id="headerBusinessName">My Business</h1>
            <p class="text-[10px] text-slate-400">Broadcaster</p>
          </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-4">
          <span class="inline-flex items-center px-2.5 sm:px-3 py-1 rounded-full text-[10px] sm:text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
            <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
            Active
          </span>
          <button id="logoutBtn" class="p-2 sm:px-3 sm:py-1.5 text-xs font-medium text-slate-500 hover:text-rose-600 rounded-lg hover:bg-rose-50 flex items-center space-x-1 transition">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Logout</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 w-full">
      
      <!-- Broadcast Sender Box (7 cols on desktop, full width on mobile) -->
      <div class="lg:col-span-7 space-y-4 sm:space-y-6">
        <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-sm border border-slate-200 space-y-4 sm:space-y-5">
          <div class="flex items-center space-x-2 pb-3 border-b border-slate-100">
            <i data-lucide="send" class="w-5 h-5 text-emerald-600"></i>
            <h2 class="text-sm sm:text-base font-bold text-slate-900">Send WhatsApp Broadcast</h2>
          </div>

          <!-- Campaign Name -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Campaign Title</label>
            <input id="campaignName" type="text" placeholder="e.g. Weekend Discount Blast"
                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" />
          </div>

          <!-- Template Selector Dropdown -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Select Message Template</label>
            <div class="relative">
              <select id="customTemplateName"
                      class="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-2xl font-medium text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none appearance-none cursor-pointer transition">
                <option value="hello_world">⚡️ hello_world (Sandbox Test)</option>
                <option value="order_update">📦 order_update (Production)</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
              </div>
            </div>
          </div>

          <!-- Phone Numbers Input -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold text-slate-700">Paste Customer Numbers</label>
              <span id="recipientCount" class="text-xs text-emerald-600 font-bold bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-100">0 numbers</span>
            </div>
            <p class="text-[11px] text-slate-400 mb-2">Paste numbers with country code (one per line). E.g. 919876543210</p>
            <textarea id="recipientList" rows="5" placeholder="919962761010&#10;918056132037&#10;919876543210"
                      class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono transition"></textarea>
          </div>

          <!-- Launch Button (Big, touch-friendly for mobile) -->
          <button id="launchBtn" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-emerald-600/25 transition flex items-center justify-center space-x-2">
            <i data-lucide="rocket" class="w-5 h-5"></i>
            <span>Launch WhatsApp Broadcast</span>
          </button>

          <div id="broadcastAlert" class="hidden p-4 rounded-2xl text-xs font-semibold"></div>
        </div>
      </div>

      <!-- Real-Time Reports & History (5 cols) -->
      <div class="lg:col-span-5 space-y-4 sm:space-y-6">
        <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-sm border border-slate-200">
          <div class="flex items-center justify-between pb-4 border-b border-slate-100">
            <div class="flex items-center space-x-2">
              <i data-lucide="bar-chart-2" class="w-5 h-5 text-emerald-600"></i>
              <h2 class="text-sm sm:text-base font-bold text-slate-900">Broadcast History</h2>
            </div>
            <button id="refreshReports" class="text-xs text-slate-500 hover:text-slate-900 flex items-center space-x-1 p-1.5 rounded-lg hover:bg-slate-100 transition">
              <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">Refresh</span>
            </button>
          </div>

          <div id="campaignsContainer" class="mt-4 space-y-3 max-h-[450px] overflow-y-auto pr-1">
            <div class="text-center py-8 text-xs text-slate-400">Loading your history...</div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- JavaScript Client Logic -->
  <script>
    lucide.createIcons();

    // Tab Switching
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 pb-3 text-emerald-600 border-b-2 border-emerald-600 text-center font-semibold';
      tabRegister.className = 'flex-1 pb-3 text-slate-400 hover:text-slate-600 text-center';
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = 'flex-1 pb-3 text-emerald-600 border-b-2 border-emerald-600 text-center font-semibold';
      tabLogin.className = 'flex-1 pb-3 text-slate-400 hover:text-slate-600 text-center';
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
    });

    // Handle Registration
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        businessName: document.getElementById('regBusinessName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        phoneNumberId: document.getElementById('regPhoneId').value.trim(),
        accessToken: document.getElementById('regToken').value.trim(),
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('grambi_token', data.token);
          showDashboard(data.user);
        } else {
          // Extract specific error message
          let errMsg = 'Registration failed';
          if (typeof data.error === 'string') {
            errMsg = data.error;
          } else if (data.error && typeof data.error === 'object') {
            const keys = Object.keys(data.error);
            if (keys.length > 0 && data.error[keys[0]]?._errors) {
              errMsg = `${keys[0]}: ${data.error[keys[0]]._errors.join(', ')}`;
            }
          }
          showAuthAlert(errMsg, 'error');
        }
      } catch (err) {
        showAuthAlert('Network error: ' + (err.message || 'Cannot reach server'), 'error');
      }
    });

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value,
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('grambi_token', data.token);
          showDashboard(data.user);
        } else {
          showAuthAlert(data.error || 'Invalid credentials', 'error');
        }
      } catch (err) {
        showAuthAlert('Network error during login', 'error');
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('grambi_token');
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
    });

    // Show Dashboard
    function showDashboard(user) {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('headerBusinessName').textContent = user.businessName || 'Business Portal';
      
      // Update wallet balance badge in UI
      if (user.walletBalance !== undefined) {
        document.getElementById('userWalletBalance').textContent = `₹${user.walletBalance.toFixed(2)}`;
      }
      
      // Clear any previous alert banners on fresh login
      const alertBox = document.getElementById('broadcastAlert');
      alertBox.classList.add('hidden');
      alertBox.textContent = '';
      
      loadCampaigns();
      fetchMetaTemplates(); // Dynamically fetch Meta templates
    }

    // Dynamically Fetch Live Templates from Meta API
    async function fetchMetaTemplates() {
      const token = localStorage.getItem('grambi_token');
      if (!token) return;

      const select = document.getElementById('customTemplateName');
      try {
        const res = await fetch('/api/templates', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const templates = data.templates || [];

        if (templates.length > 0) {
          select.innerHTML = templates.map(t => {
            const isApproved = t.status === 'APPROVED';
            const statusIcon = isApproved ? '🟢' : t.status === 'IN_REVIEW' ? '🟡' : '🔴';
            const disabledAttr = !isApproved && t.name !== 'hello_world' ? 'disabled' : '';
            return `<option value="${t.name}" ${disabledAttr}>${statusIcon} ${t.name} (${t.status})</option>`;
          }).join('');
        }
      } catch (err) {
        console.error('Failed to sync templates dynamically', err);
      }
    }

    // Number parser
    document.getElementById('recipientList').addEventListener('input', (e) => {
      const numbers = parseNumbers(e.target.value);
      const count = numbers.length;
      document.getElementById('recipientCount').textContent = `${count} numbers`;
    });

    function parseNumbers(raw) {
      return raw.split(/[\n,]+/).map(n => n.replace(/[^0-9]/g, '')).filter(n => n.length >= 10);
    }

    // Launch Broadcast
    document.getElementById('launchBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('grambi_token');
      const campaignName = document.getElementById('campaignName').value.trim();
      const templateName = document.getElementById('customTemplateName').value.trim() || 'hello_world';
      const numbers = parseNumbers(document.getElementById('recipientList').value);

      if (!campaignName || numbers.length === 0) {
        showBroadcastAlert('Please provide a campaign title and at least 1 phone number.', 'error');
        return;
      }

      const payload = {
        campaignName,
        templateName,
        languageCode: 'en_US',
        recipients: numbers.map(phoneNumber => ({ phoneNumber }))
      };

      try {
        const res = await fetch('/api/messages/bulk', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (res.ok) {
          showBroadcastAlert(`🚀 Successfully launched broadcast to ${data.totalQueued} customers!`, 'success');
          document.getElementById('recipientList').value = '';
          document.getElementById('recipientCount').textContent = '0 numbers';
          
          // Poll immediately after 1s, 2s, and 3s so status updates from "Queued" to "Sent" live
          setTimeout(loadCampaigns, 800);
          setTimeout(loadCampaigns, 2000);
          setTimeout(loadCampaigns, 4000);
        } else {
          showBroadcastAlert(data.error || 'Failed to dispatch broadcast', 'error');
        }
      } catch (e) {
        showBroadcastAlert('Network error occurred', 'error');
      }
    });

    // Instant Sandbox Test (No Template Review Needed)
    document.getElementById('sandboxTestBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('grambi_token');
      const numbers = parseNumbers(document.getElementById('recipientList').value);

      if (numbers.length === 0) {
        showBroadcastAlert('Please paste at least 1 verified test phone number.', 'error');
        return;
      }

      try {
        const res = await fetch('/api/messages/sandbox-test', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({ recipientNumber: numbers[0] }),
        });

        const data = await res.json();
        if (res.ok) {
          showBroadcastAlert(`⚡ Instant test message sent successfully to ${numbers[0]}!`, 'success');
        } else {
          showBroadcastAlert(data.error || 'Failed to send sandbox test', 'error');
        }
      } catch (err) {
        showBroadcastAlert('Network error during sandbox test', 'error');
      }
    });

    // Load Campaigns with Modern Visual Analytics Cards & Progress Bars
    async function loadCampaigns() {
      const token = localStorage.getItem('grambi_token');
      if (!token) return;

      const container = document.getElementById('campaignsContainer');
      try {
        const res = await fetch('/api/campaigns', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const campaigns = await res.json();

        if (campaigns.length === 0) {
          container.innerHTML = `
            <div class="text-center py-10 px-4">
              <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <i data-lucide="inbox" class="w-6 h-6"></i>
              </div>
              <p class="text-xs font-semibold text-slate-700">No broadcasts launched yet</p>
              <p class="text-[11px] text-slate-400 mt-1">Your sent campaigns and live delivery progress will show here.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        container.innerHTML = campaigns.map(c => {
          const sent = c.summary.SENT || 0;
          const delivered = c.summary.DELIVERED || 0;
          const read = c.summary.READ || 0;
          const failed = c.summary.FAILED || 0;
          const pending = c.summary.PENDING || 0;
          const total = c.total || (sent + delivered + read + failed + pending) || 1;

          // Compute success percentage
          const successCount = sent + delivered + read;
          const percent = Math.min(100, Math.round((successCount / total) * 100));

          // Format readable date
          const dateObj = new Date(c.createdAt);
          const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const dateStr = dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' });

          const isCompleted = pending === 0;
          const statusBadge = isCompleted
            ? (failed > 0 && successCount === 0 
                ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-200">Failed</span>'
                : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Completed</span>')
            : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200 animate-pulse">Broadcasting...</span>';

          return `
            <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 hover:border-slate-300 shadow-xs transition-all space-y-3.5">
              
              <!-- Card Header -->
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <h3 class="text-xs sm:text-sm font-bold text-slate-900 truncate leading-tight">${c.name}</h3>
                  <div class="flex items-center space-x-2 mt-1">
                    <span class="text-[10px] font-mono font-medium text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 truncate max-w-[120px] sm:max-w-xs">
                      ${c.templateName}
                    </span>
                    <span class="text-[10px] text-slate-400 font-medium">${dateStr}, ${timeStr}</span>
                  </div>
                </div>
                ${statusBadge}
              </div>

              <!-- Visual Progress Bar -->
              <div class="space-y-1">
                <div class="flex items-center justify-between text-[11px] font-semibold text-slate-600">
                  <span>Delivery Success</span>
                  <span class="${percent === 100 ? 'text-emerald-600' : 'text-slate-800'} font-bold">${percent}%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden flex">
                  <div class="bg-emerald-500 h-full transition-all duration-500" style="width: ${percent}%"></div>
                  ${failed > 0 ? `<div class="bg-rose-500 h-full" style="width: ${Math.round((failed / total) * 100)}%"></div>` : ''}
                </div>
              </div>

              <!-- Stat Badges Grid -->
              <div class="grid grid-cols-4 gap-1.5 pt-1 text-center">
                <div class="bg-slate-50 border border-slate-100 rounded-xl py-1.5 px-1">
                  <div class="text-[9px] font-semibold text-slate-400 uppercase">Total</div>
                  <div class="text-xs font-bold text-slate-800">${total}</div>
                </div>
                <div class="bg-blue-50/60 border border-blue-100 rounded-xl py-1.5 px-1">
                  <div class="text-[9px] font-semibold text-blue-500 uppercase">Sent</div>
                  <div class="text-xs font-bold text-blue-700">${sent}</div>
                </div>
                <div class="bg-emerald-50/60 border border-emerald-100 rounded-xl py-1.5 px-1">
                  <div class="text-[9px] font-semibold text-emerald-600 uppercase">Delivered</div>
                  <div class="text-xs font-bold text-emerald-700">${delivered}</div>
                </div>
                <div class="${failed > 0 ? 'bg-rose-50/80 border-rose-200' : 'bg-slate-50 border-slate-100'} border rounded-xl py-1.5 px-1">
                  <div class="text-[9px] font-semibold ${failed > 0 ? 'text-rose-500' : 'text-slate-400'} uppercase">Failed</div>
                  <div class="text-xs font-bold ${failed > 0 ? 'text-rose-700 font-extrabold' : 'text-slate-400'}">${failed}</div>
                </div>
              </div>

            </div>
          `;
        }).join('');
        lucide.createIcons();
      } catch (err) {
        console.error(err);
      }
    }

    function showAuthAlert(msg, type) {
      const el = document.getElementById('authAlert');
      el.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'bg-rose-50', 'text-rose-800');
      el.classList.add(type === 'success' ? 'bg-emerald-50' : 'bg-rose-50', type === 'success' ? 'text-emerald-800' : 'text-rose-800');
      el.textContent = msg;
    }

    function showBroadcastAlert(msg, type) {
      const el = document.getElementById('broadcastAlert');
      el.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'bg-rose-50', 'text-rose-800');
      el.classList.add(type === 'success' ? 'bg-emerald-50' : 'bg-rose-50', type === 'success' ? 'text-emerald-800' : 'text-rose-800');
      el.textContent = msg;
    }

    // Modal Logic for Updating Phone ID and Access Token
    const settingsModal = document.getElementById('settingsModal');
    const settingsToggleBtn = document.getElementById('settingsToggleBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');

    settingsToggleBtn.addEventListener('click', async () => {
      const token = localStorage.getItem('grambi_token');
      try {
        const res = await fetch('/api/auth/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await res.json();
        document.getElementById('modalPhoneId').value = user.phoneNumberId || '';
        document.getElementById('modalToken').value = '';
        settingsModal.classList.remove('hidden');
      } catch (e) {
        console.error(e);
      }
    });

    const closeModal = () => settingsModal.classList.add('hidden');
    closeSettingsBtn.addEventListener('click', closeModal);
    cancelSettingsBtn.addEventListener('click', closeModal);

    saveSettingsBtn.addEventListener('click', async () => {
      const token = localStorage.getItem('grambi_token');
      const phoneNumberId = document.getElementById('modalPhoneId').value.trim();
      const accessToken = document.getElementById('modalToken').value.trim();

      try {
        const res = await fetch('/api/auth/profile', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({ phoneNumberId, accessToken: accessToken || undefined }),
        });

        if (res.ok) {
          showBroadcastAlert('✅ Meta credentials updated successfully!', 'success');
          closeModal();
        } else {
          showBroadcastAlert('Failed to update credentials.', 'error');
        }
      } catch (err) {
        showBroadcastAlert('Error updating credentials.', 'error');
      }
    });

    // Auto Login on startup if token exists
    window.addEventListener('load', async () => {
      const token = localStorage.getItem('grambi_token');
      if (token) {
        try {
          const res = await fetch('/api/auth/profile', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const user = await res.json();
            showDashboard(user);
          } else {
            localStorage.removeItem('grambi_token');
          }
        } catch (e) {
          localStorage.removeItem('grambi_token');
        }
      }
    });

    document.getElementById('refreshReports').addEventListener('click', loadCampaigns);
    setInterval(loadCampaigns, 5000);
  </script>
</body>
</html>
